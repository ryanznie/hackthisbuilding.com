name: Deploy public simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a deployment between the Worker and Pages releases.
# GitHub keeps the newest pending run while an existing run finishes.
concurrency:
  group: hackthisbuilding-production
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: simulator
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the simulator
        run: npm run build

      - name: Skip a superseded commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipped ${GITHUB_SHA}: main has advanced to ${latest_sha}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check deployment credential readiness
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped: configure repository secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to enable publishing. Validation completed normally."
            echo "Deployment skipped because Cloudflare repository secrets are not configured. Tests and build still ran; this workflow did not publish a release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the API Worker
        if: steps.release.outputs.deploy == 'true' && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy

      - name: Deploy Pages and the production domain
        if: steps.release.outputs.deploy == 'true' && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --no-install wrangler pages deploy
          --cwd pages
          --project-name hackthisbuilding
          --branch main
          --commit-hash "$GITHUB_SHA"

      - name: Check the public API through Pages
        if: steps.release.outputs.deploy == 'true' && steps.credentials.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "https://www.hackthisbuilding.com/api/health" \
            | node -e 'let body = ""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const result = JSON.parse(body); if (result.ok !== true || result.mode !== "simulator") process.exit(1); console.log("Production API is healthy."); });'

      - name: Record the release
        if: steps.release.outputs.deploy == 'true' && steps.credentials.outputs.ready == 'true'
        run: |
          echo "Deployed commit ${GITHUB_SHA} to https://www.hackthisbuilding.com." >> "$GITHUB_STEP_SUMMARY"
